[package]
name = "smart-file-organizer"
version = "0.1.0"
description = "Smart File Organizer - Akilli dosya tarama, gruplama ve tasima uygulamasi"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "smart_file_organizer_lib"
# Yalnizca Windows masaustu: mobil icin gereken staticlib/cdylib uretilmez.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# Windows ile baslatma (HKCU Run kaydi) ve otomatik tasima bildirimleri; ikisi de yalnizca Rust tarafindan kullanilir.
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Dosya tarama (cok cekirdekli) ve gruplama motoru
jwalk = "0.8"
rayon = "1"
blake3 = "1"
strsim = "0.11"
# Gelen kutusu gun klasoru yerel tarihle belirlenir (UTC degil).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
notify = { version = "8", default-features = false }
# Gelen kutusu kucuk resimleri (yalnizca gereken bicimler; heic desteklenmez).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
trash = "5"
# Harita > Klasordeki dosyalar: Gezgin ile ayni kucuk resimler ve cekim tarihi (Tauri zaten 0.62 kullanir).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }

[dev-dependencies]
criterion = "0.5"
strsim = "0.11"

[[bench]]
name = "grouper_bench"
harness = false

# Build-script'ler hata ayiklama bilgisi olmadan derlenir: hem derleme hizlanir hem de
# bu makinedeki antivirusun debug build-script exe'sini (tauri-plugin-dialog) yanlislikla
# kilitlemesi asilir. Uygulamanin kendi kodunu etkilemez.
[profile.dev.build-override]
debug = false

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
# NOT: panic = "abort" kullanilmiyor; criterion bench'leri "unwind" gerektirir
# (cargo test/bench hedefleri abort stratejisiyle derlenemez).
