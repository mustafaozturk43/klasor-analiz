name: release

# Yayin: `git tag v0.2.0 && git push origin v0.2.0` bu akisi baslatir. Kurulum (NSIS) ve portable ZIP
# derlenir, SHA256 dosyalariyla birlikte GitHub Releases'e TASLAK olarak yuklenir; yayimlamak icin
# taslagi GitHub'da gozden gecirip "Publish release" demek gerekir.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: Etiket package.json surumuyle ayni mi?
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Etiket ($GITHUB_REF_NAME) package.json surumuyle (v$version) eslesmiyor. 'npm run version:set -- X.Y.Z' calistirip commit edin, sonra etiketleyin."
            exit 1
          fi

      # Surum uyumu, derleme, vitest, kaynak denetimi ve Rust testleri.
      - run: npm run check

      # Kod imzalama (Authenticode): WINDOWS_PFX_BASE64 ve WINDOWS_PFX_PASSWORD gizli anahtarlari varsa PFX
      # gecici olarak kullanici sertifika deposuna alinir ve Tauri'ye TAURI_CONFIG ile parmak izi verilir
      # (uygulama exe'si ve kurulum dosyasi imzalanir). Yoksa derleme imzasiz devam eder.
      - name: Kod imzalama sertifikasini hazirla
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:PFX_B64)) {
            Write-Host "::warning::WINDOWS_PFX_BASE64 tanimli degil; paketler kod imzasiz derlenecek (SmartScreen uyarisi gosterebilir)."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force)
          Remove-Item $pfx -Force
          $cfg = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } } | ConvertTo-Json -Compress -Depth 5
          "TAURI_CONFIG=$cfg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIGNED_BUILD=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Sertifika hazir: $($cert.Subject)"

      # Kurulum (NSIS) + portable ZIP; artifacts/ altina SHA256 ile yazar. Guncelleme imzasi icin
      # TAURI_SIGNING_PRIVATE_KEY (ve parolasi) depo gizli anahtari olarak tanimli olmali.
      - name: Guncelleme anahtari tanimli mi?
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY gizli anahtari tanimli degil (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - run: npm run release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Sertifika kullanildiysa kurulum dosyasi ve portable exe'nin Authenticode imzasi GECERLI olmali;
      # degilse (ornegin guvenilmeyen zincir) surum taslagi bile olusturulmaz.
      - name: Kod imzasini dogrula
        if: env.SIGNED_BUILD == 'true'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem artifacts -Filter '*-setup-*.exe') + @(Get-ChildItem artifacts -Directory -Filter '*-portable-*' | ForEach-Object { Get-ChildItem $_.FullName -Filter 'SmartFileOrganizer.exe' })
          if ($files.Count -lt 2) { throw "Dogrulanacak dosyalar bulunamadi (kurulum ve portable exe bekleniyordu): $($files.Count)" }
          $bad = @()
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status) · $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { $bad += $f.Name }
          }
          if ($bad.Count) { throw "Gecerli Authenticode imzasi yok: $($bad -join ', ')" }

      # Guncelleyicinin okudugu latest.json (kurulum imzasi + indirme adresi).
      - name: latest.json uret
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/make-latest-json.mjs "$GITHUB_REF_NAME"

      - name: GitHub taslak surumu olustur
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/*-setup-*.exe artifacts/*-setup-*.exe.sig artifacts/*-setup-*.exe.sha256 artifacts/latest.json \
            artifacts/*-portable-*.zip artifacts/*-portable-*.zip.sha256 \
            --draft --generate-notes --title "Smart File Organizer $GITHUB_REF_NAME"
