name: release

# Yayin: `git tag v0.2.0 && git push origin v0.2.0` bu akisi baslatir. Kurulum (NSIS) ve portable ZIP
# derlenir, SHA256 dosyalariyla birlikte GitHub Releases'e TASLAK olarak yuklenir; yayimlamak icin
# taslagi GitHub'da gozden gecirip "Publish release" demek gerekir.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: Etiket package.json surumuyle ayni mi?
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Etiket ($GITHUB_REF_NAME) package.json surumuyle (v$version) eslesmiyor. 'npm run version:set -- X.Y.Z' calistirip commit edin, sonra etiketleyin."
            exit 1
          fi

      # Surum uyumu, derleme, vitest, kaynak denetimi ve Rust testleri.
      - run: npm run check

      # Kurulum (NSIS) + portable ZIP; artifacts/ altina SHA256 ile yazar. Guncelleme imzasi icin
      # TAURI_SIGNING_PRIVATE_KEY (ve parolasi) depo gizli anahtari olarak tanimli olmali.
      - name: Guncelleme anahtari tanimli mi?
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY gizli anahtari tanimli degil (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - run: npm run release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Guncelleyicinin okudugu latest.json (kurulum imzasi + indirme adresi).
      - name: latest.json uret
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/make-latest-json.mjs "$GITHUB_REF_NAME"

      - name: GitHub taslak surumu olustur
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/*-setup-*.exe artifacts/*-setup-*.exe.sig artifacts/*-setup-*.exe.sha256 artifacts/latest.json \
            artifacts/*-portable-*.zip artifacts/*-portable-*.zip.sha256 \
            --draft --generate-notes --title "Smart File Organizer $GITHUB_REF_NAME"
